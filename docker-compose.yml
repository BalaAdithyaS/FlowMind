version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Connect to the host machine's Ollama instance to avoid redownloading models
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      # Required for host.docker.internal to resolve on some Linux hosts
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
